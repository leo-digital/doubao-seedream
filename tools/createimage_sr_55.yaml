identity:
  name: ImageGenerations55
  author: leo-digital
  label:
    en_US: ImageGenerations (5.5)
    zh_Hans: 图片生成5.5
description:
  human:
    en_US: Generate and edit images, create transparent PNGs, or decompose an image into layers with rich-text OCR
      using Seedream 5.5.
    zh_Hans: 使用 Seedream 5.5 生成或编辑图片、生成透明 PNG，或拆分图层并返回富文本 OCR。
  llm: Generate one image from text and up to 10 reference images, including transparent PNGs. Alternatively decompose
    exactly one image into a base image and layers, optionally with rich-text OCR. No group generation, web search,
    or streaming.
output_schema:
  type: object
  properties:
    images:
      type: array
      items:
        type: object
        properties:
          url:
            type: string
          size:
            type: string
          output_format:
            type: string
          background:
            type: string
          name:
            type: string
          description:
            type: string
          z_index:
            type: integer
          bounding_box:
            type: object
            properties:
              absolute:
                type: array
                items:
                  type: integer
                minItems: 4
                maxItems: 4
              normalized:
                type: array
                items:
                  type: integer
                minItems: 4
                maxItems: 4
          text_recognition:
            type: object
            properties:
              text:
                type: string
              lines:
                type: array
                items:
                  type: object
                  properties:
                    bounding_box:
                      type: object
                      properties:
                        absolute:
                          type: array
                          items:
                            type: integer
                          minItems: 4
                          maxItems: 4
                        normalized:
                          type: array
                          items:
                            type: integer
                          minItems: 4
                          maxItems: 4
                    runs:
                      type: array
                      items:
                        type: object
                        properties:
                          text:
                            type: string
                          style:
                            type: object
                            properties:
                              similar_font_family:
                                type: string
                              foreground_color:
                                type: string
                              bold:
                                type: boolean
                              italic:
                                type: boolean
                              underline:
                                type: boolean
                              strikethrough:
                                type: boolean
                              shadow:
                                type: boolean
                              translucent:
                                type: boolean
parameters:
- name: layer_decomposition
  type: boolean
  required: false
  default: false
  label:
    en_US: Layer decomposition
    zh_Hans: 图层拆分
  human_description:
    en_US: 'Split exactly one input image into a base image and transparent layers. Default: false.'
    zh_Hans: 将一张图片拆分为底图和透明图层，默认关闭。
  llm_description: 'Split exactly one input image into a base image and transparent layers. Default: false.'
  form: form
- name: prompt
  type: string
  required: false
  label:
    en_US: Prompt words for image generation
    zh_Hans: 文本提示词
  human_description:
    en_US: Required for image generation; optional for layer decomposition. Leave blank to split major elements
      automatically.
    zh_Hans: 普通生图必填；图层拆分可留空，模型会自动识别并拆分主要元素。
  llm_description: Required for image generation; optional for layer decomposition. Leave blank to split major elements
    automatically.
  form: form
- name: image
  type: files
  required: false
  label:
    en_US: Reference images
    zh_Hans: 参考图片
  human_description:
    en_US: Reference image list (up to 10 images). Layer decomposition requires exactly one PNG/JPEG image across
      both input fields.
    zh_Hans: 参考图片列表（最多 10 张）。 图层拆分时两个输入字段合计必须为一张 PNG/JPEG 图片。
  llm_description: Reference image list (up to 10 images). Layer decomposition requires exactly one PNG/JPEG image
    across both input fields.
  form: form
- name: image_urls
  type: string
  required: false
  label:
    en_US: Reference image URLs (optional)
    zh_Hans: 参考图片 URL（可选）
  human_description:
    en_US: Enter one or more reference image URLs, separated by commas. Support up to 10 images. Layer decomposition
      requires exactly one PNG/JPEG image across both input fields.
    zh_Hans: 可输入一个或多个参考图片 URL，多个 URL 请用英文逗号分隔，支持最多 10 张。 图层拆分时两个输入字段合计必须为一张 PNG/JPEG 图片。
  llm_description: Enter one or more reference image URLs, separated by commas. Support up to 10 images. Layer decomposition
    requires exactly one PNG/JPEG image across both input fields.
  form: form
- name: size
  type: select
  required: false
  default: 2K
  label:
