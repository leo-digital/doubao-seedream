    zh_Hans: 仅普通生图有效：1K/1.5K/2K、官方像素预设或自定义宽高。图层拆分时忽略。
  llm_description: 'Image generation only: 1K/1.5K/2K, an official pixel preset, or custom dimensions. Ignored during
    layer decomposition.'
  form: form
- name: width
  type: number
  required: false
  label:
    en_US: Custom width
    zh_Hans: 自定义宽度
  human_description:
    en_US: Effective when size is Customize. Width*height must be in [921600, 4624220], with aspect ratio in [1/16,
      16].
    zh_Hans: 仅在尺寸为“自定义”时生效。宽×高须在 [921600, 4624220] 内，宽高比须在 [1/16, 16] 内。
  llm_description: Custom image width in pixels, used only when size is customize.
  form: form
