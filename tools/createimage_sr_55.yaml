      16].
    zh_Hans: 仅在尺寸为“自定义”时生效。宽×高须在 [921600, 4624220] 内，宽高比须在 [1/16, 16] 内。
  llm_description: Custom image height in pixels, used only when size is customize.
  form: form
- name: layer_size
  type: select
  required: false
  default: auto
  label:
    en_US: Layer decomposition size
    zh_Hans: 图层拆分尺寸
  human_description:
    en_US: Layer decomposition only. Auto adapts to the input image dimensions.
    zh_Hans: 仅图层拆分有效，auto 根据输入图片尺寸适配。
  llm_description: Layer decomposition only. Auto adapts to the input image dimensions.
  form: form
  options:
  - label:
      en_US: auto
      zh_Hans: auto
    value: auto
  - label:
      en_US: 1K
      zh_Hans: 1K
    value: 1K
  - label:
      en_US: 1.5K
      zh_Hans: 1.5K
    value: 1.5K
  - label:
      en_US: 2K
      zh_Hans: 2K
    value: 2K
- name: max_images
  type: number
  required: false
  default: 30
  label:
    en_US: Maximum output images
    zh_Hans: 最大输出图片数
  human_description:
    en_US: 'Layer decomposition only: integer from 2 to 100, including the base image. Default 30. Actual count
      may be lower.'
    zh_Hans: 仅图层拆分有效：2–100 的整数，包含底图，默认 30。实际输出可能少于此值。
  llm_description: 'Layer decomposition only: integer from 2 to 100, including the base image. Default 30. Actual
    count may be lower.'
  form: form
- name: text_recognition
  type: boolean
  required: false
  default: false
  label:
    en_US: Rich-text OCR
    zh_Hans: 富文本 OCR
  human_description:
    en_US: Layer decomposition only. Return text, line coordinates and approximate styles for regular text layers.
      Artistic/handwritten text may have no OCR.
    zh_Hans: 仅图层拆分有效。返回规整文字的内容、逐行坐标和近似样式；艺术字、手写体可能不返回 OCR。
  llm_description: Layer decomposition only. Return text, line coordinates and approximate styles for regular text
    layers. Artistic/handwritten text may have no OCR.
  form: form
- name: output_format
  type: select
  required: false
  default: png
  label:
    en_US: Output format
    zh_Hans: 输出格式
  options:
  - label:
      zh_Hans: jpeg
      en_US: jpeg
    value: jpeg
  - label:
      zh_Hans: png
      en_US: png
    value: png
  human_description:
    en_US: Default PNG. Transparent backgrounds require PNG. In layer mode this controls the base image only; layers
      are always PNG.
    zh_Hans: 默认 PNG。透明背景必须使用 PNG；图层拆分时仅控制底图格式，其他图层始终为 PNG。
  llm_description: Default PNG. Transparent backgrounds require PNG. In layer mode this controls the base image
    only; layers are always PNG.
  form: form
- name: background
  type: select
  required: false
  default: auto
  label:
    en_US: Background
    zh_Hans: 背景类型
  human_description:
    en_US: Image generation only. Auto follows the prompt; transparent requires PNG; opaque is recommended for consistent
      multi-turn editing.
    zh_Hans: 仅普通生图有效。auto 根据提示词判断；transparent 要求 PNG；多轮编辑建议 opaque。
  llm_description: Image generation only. Auto follows the prompt; transparent requires PNG; opaque is recommended
    for consistent multi-turn editing.
  form: form
  options:
  - label:
      en_US: auto
      zh_Hans: auto
    value: auto
  - label:
      en_US: transparent
      zh_Hans: transparent
    value: transparent
  - label:
      en_US: opaque
      zh_Hans: opaque
    value: opaque
- name: watermark
  type: boolean
  required: false
  default: false
  label:
    en_US: Watermark
    zh_Hans: 水印
  human_description:
    en_US: Whether to add the AI-generated watermark.
    zh_Hans: 是否在图片右下角添加“AI生成”水印。
  llm_description: 'Whether to add an AI-generated watermark. Default: false.'
  form: form
extra:
  python:
